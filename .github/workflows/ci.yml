name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree changed, so a site- or docs-only change skips
  # the Go, web and image jobs. Skipped jobs count as passing for the
  # required checks on main. Shared inputs (mise.toml, this file) run
  # everything, and so does any push without a usable base.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=ALL
          else
            files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          fi
          printf '%s\n' "$files"
          any() { [ "$files" = ALL ] || printf '%s\n' "$files" | grep -qE "$1"; }
          shared='^(mise\.toml|\.github/workflows/ci\.yml)$'
          go=false; web=false; image=false
          any "$shared|^(cmd|internal|api)/|^web/embed\.go$|^go\.(mod|sum)$|^Makefile$" && go=true
          any "$shared|^web/|^api/openapi\.yaml$" && web=true
          { [ $go = true ] || [ $web = true ] || any '^(Dockerfile|\.dockerignore)$'; } && image=true
          echo "go=$go web=$web image=$image" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "go=$go"; echo "web=$web"; echo "image=$image"; } >> "$GITHUB_OUTPUT"

  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v7
      # Go and Node versions come from mise.toml, same as local development.
      - uses: jdx/mise-action@v5
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal web/embed.go)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      # Contract tests validate mock responses against api/openapi.yaml.
      - run: go test -race ./...

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # BenchmarkLive on the full reference dataset (~500k plays): full
      # rebuild (budget 10 s), dashboard endpoints p95 (25 ms) and History
      # p95 (50 ms) from docs/project/plan.md. Shared runners are slower and
      # noisier than a workstation, so the run fails only past 2.5x the
      # budget (25 s, 62.5 ms, 125 ms); an endpoint over its limit is
      # measured once more before it fails.
      - name: Benchmarks against the budgets
        env:
          SPOTUSSI_BENCH_BUDGET_FACTOR: '2.5'
          SPOTUSSI_BENCH_SUMMARY: ${{ runner.temp }}/perf.md
        run: go test -run '^$' -bench Live -benchtime 1x -timeout 15m ./internal/live
      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  web:
    name: Web check, lint and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: svelte-check
        working-directory: web
        run: pnpm check
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Build
        working-directory: web
        run: pnpm build

  image:
    name: Multi-arch image build
    runs-on: ubuntu-latest
    needs: [changes, go, web]
    # Runs when its inputs changed and go/web passed or were skipped.
    if: >-
      !cancelled() && needs.changes.outputs.image == 'true' &&
      !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only: nothing is pushed until a registry is configured.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
