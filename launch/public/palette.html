*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Archivo,system-ui,sans-serif;padding:32px 16px 64px}

.takes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.take{border:1px solid var(--grille);border-radius:9px;padding:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.take.pick{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp)}
.take.silent{opacity:.4}
.play{width:34px;height:34px;border-radius:50%;border:0;background:var(--grille);color:var(--fg);font-size:13px;cursor:pointer;flex:none}
.play.on{background:var(--lamp);color:#0b0c0e}
.meta{font-size:12px;color:var(--mute);line-height:1.3}.meta strong{color:var(--fg);font-size:14px}
.bar{position:sticky;bottom:12px;margin-top:28px;background:var(--card);border:1px solid var(--grille);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar code{flex:1;min-width:0;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.bar button{background:var(--lamp);color:#0b0c0e;border:0;border-radius:8px;padding:8px 14px;font:600 13px Archivo,sans-serif;cursor:pointer}

let picks={};try{picks=JSON.parse(localStorage.getItem("picks")||"{}")}catch(e){}
const audio=new Audio();let cur=null;
const list=document.getElementById("list");let g="";
for(const r of DATA){
 if(r.group!==g){g=r.group;list.insertAdjacentHTML("beforeend","<h2>"+g+"</h2>")}
 const row=document.createElement("div");row.className="row";
 row.innerHTML="<h3>"+r.key+"</h3><p>"+r.desc+"</p><div class=takes></div>";
 const box=row.querySelector(".takes");
 for(const t of r.takes){
  const el=document.createElement("div");el.className="take"+(t.silent?" silent":"")+(picks[r.key]===t.take?" pick":"");
  el.innerHTML="<button class=play>▶</button><div class=meta><strong>Take "+t.take+"</strong><br>"+t.dur+" s · peak "+t.peak+" dB"+(t.silent?" · silent":"")+"</div>";
  const b=el.querySelector(".play");
  b.onclick=e=>{e.stopPropagation();if(cur===b&&!audio.paused){audio.pause();b.classList.remove("on");b.textContent="▶";return}
   if(cur){cur.classList.remove("on");cur.textContent="▶"}audio.src="audio/palette/"+t.file.split("/").pop();audio.currentTime=0;audio.play();cur=b;b.classList.add("on");b.textContent="■"};
  el.onclick=()=>{picks[r.key]=picks[r.key]===t.take?undefined:t.take;box.querySelectorAll(".take").forEach(x=>x.classList.remove("pick"));if(picks[r.key])el.classList.add("pick");save()};
  box.appendChild(el)}
 list.appendChild(row)}
audio.onended=()=>{if(cur){cur.classList.remove("on");cur.textContent="▶"}};
function save(){try{localStorage.setItem("picks",JSON.stringify(picks))}catch(e){}const s=Object.entries(picks).filter(x=>x[1]).map(x=>x[0]+" "+x[1]).join(", ");document.getElementById("out").textContent=s||"No picks yet."}
save();
document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(document.getElementById("out").textContent);
